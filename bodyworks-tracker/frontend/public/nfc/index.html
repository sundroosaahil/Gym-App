<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bodyworks Tracker</title><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#F5F5F0;font:600 16px system-ui,sans-serif;text-align:center}a{color:#F2C230}</style>
</head><body><p>Opening Bodyworks Tracker&hellip;<br><br><a id="go" href="/">Tap here if nothing happens</a></p>
<script>
// A sticker link (https://bodyworks-tracker.vercel.app/nfc?...) lands here when the phone has no app to hand it to.
// Pass the whole link on to the web app, which does what the sticker says (start workout, open an exercise).
var to = '/?tag=' + encodeURIComponent(location.href);
document.getElementById('go').href = to;
location.replace(to);
</script></body></html>
