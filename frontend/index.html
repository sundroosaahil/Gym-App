<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bodyworks" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bodyworks Gym</title>
  </head>
  <body>
    <div id="root">
      <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0D0D0D;">
        <img src="/images/logo.png" style="width:80px; height:80px; animation: pulse 1.5s ease-in-out infinite;" />
        <style>
          @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
